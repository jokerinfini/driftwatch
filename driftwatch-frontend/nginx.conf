server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy for local docker-compose (no CORS needed). On Vercel the
    # app talks to the backend cross-origin via REACT_APP_API_BASE instead.
    location /watchlist { proxy_pass http://driftwatch-backend:8010/watchlist; proxy_set_header Host $host; }
    location /coin/     { proxy_pass http://driftwatch-backend:8010/coin/; proxy_set_header Host $host; }
    location /alerts    { proxy_pass http://driftwatch-backend:8010/alerts; proxy_set_header Host $host; }
    location /drift     { proxy_pass http://driftwatch-backend:8010/drift; proxy_set_header Host $host; }
    location /load/     { proxy_pass http://driftwatch-backend:8010/load/; proxy_set_header Host $host; }
    location /health    { proxy_pass http://driftwatch-backend:8010/health; }

    # Metrics SSE: buffering off + long read so events flush as they arrive.
    location /metrics {
        proxy_pass http://driftwatch-backend:8010/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
